[project]
name = "zimbra-mail-trace"
version = "0.1.0"
description = "Human-readable Zimbra/Postfix mail tracing"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.9",
  "paramiko==4.0.0",
  "cryptography==45.0.6",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.20",
  "tzdata==2025.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
